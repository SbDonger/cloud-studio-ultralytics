# Ultralytics YOLO11n-P2 + CA on all neck outputs (P2/P3/P4/P5)
# 4-scale detection: P2, P3, P4, P5
# CA placed before Detect on each PAN output
# Gamma-initialized residual CA: starts as identity, learns gradually

nc: 10

scales:
  n: [0.50, 0.25, 1024]
  s: [0.50, 0.50, 1024]
  m: [0.50, 1.00, 512]
  l: [1.00, 1.00, 512]
  x: [1.00, 1.50, 512]

# YOLO11n backbone
backbone:
  # [from, repeats, module, args]
  - [-1, 1, Conv, [64, 3, 2]]             # 0-P1/2
  - [-1, 1, Conv, [128, 3, 2]]            # 1-P2/4
  - [-1, 2, C3k2, [256, False, 0.25]]     # 2
  - [-1, 1, Conv, [256, 3, 2]]            # 3-P3/8
  - [-1, 2, C3k2, [512, False, 0.25]]     # 4
  - [-1, 1, Conv, [512, 3, 2]]            # 5-P4/16
  - [-1, 2, C3k2, [512, True]]            # 6
  - [-1, 1, Conv, [1024, 3, 2]]           # 7-P5/32
  - [-1, 2, C3k2, [1024, True]]           # 8
  - [-1, 1, SPPF, [1024, 5]]              # 9
  - [-1, 2, C2PSA, [1024]]                # 10

# YOLO11n head + CA on P2/P3/P4/P5 before Detect
head:
  # FPN: P5 -> P4
  - [-1, 1, nn.Upsample, [None, 2, nearest]]
  - [[-1, 6], 1, Concat, [1]]
  - [-1, 2, C3k2, [512, False]]           # 13-P4/16

  # FPN: P4 -> P3
  - [-1, 1, nn.Upsample, [None, 2, nearest]]
  - [[-1, 4], 1, Concat, [1]]
  - [-1, 2, C3k2, [256, False]]           # 16-P3/8

  # FPN: P3 -> P2
  - [-1, 1, nn.Upsample, [None, 2, nearest]]
  - [[-1, 2], 1, Concat, [1]]
  - [-1, 2, C3k2, [128, False]]           # 19-P2/4

  # PAN: P2 -> P3
  - [-1, 1, Conv, [128, 3, 2]]            # 20
  - [[-1, 16], 1, Concat, [1]]            # 21
  - [-1, 2, C3k2, [256, False]]           # 22-P3/8

  # PAN: P3 -> P4
  - [-1, 1, Conv, [256, 3, 2]]            # 23
  - [[-1, 13], 1, Concat, [1]]            # 24
  - [-1, 2, C3k2, [512, False]]           # 25-P4/16

  # PAN: P4 -> P5
  - [-1, 1, Conv, [512, 3, 2]]            # 26
  - [[-1, 10], 1, Concat, [1]]            # 27
  - [-1, 2, C3k2, [1024, True]]           # 28-P5/32

  # CA before Detect
  - [19, 1, CA, [32]]                     # 29-P2 CA
  - [22, 1, CA, [32]]                     # 30-P3 CA
  - [25, 1, CA, [32]]                     # 31-P4 CA
  - [28, 1, CA, [32]]                     # 32-P5 CA

  # Detect
  - [[29, 30, 31, 32], 1, Detect, [nc]]   # Detect(P2+CA, P3+CA, P4+CA, P5+CA)
