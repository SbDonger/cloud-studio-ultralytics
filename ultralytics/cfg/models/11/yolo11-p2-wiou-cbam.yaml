# YOLO11-P2 + WIoU + CBAM for VisDrone small object detection

# Parameters
nc: 10
scales:
  n: [0.50, 0.25, 1024]
  s: [0.50, 0.50, 1024]
  m: [0.50, 1.00, 512]
  l: [1.00, 1.00, 512]
  x: [1.00, 1.50, 512]

# YOLO11n-P2 backbone + CBAM
backbone:
  # [from, repeats, module, args]
  - [-1, 1, Conv, [64, 3, 2]]      # 0-P1/2
  - [-1, 1, Conv, [128, 3, 2]]     # 1-P2/4
  - [-1, 2, C3k2, [256, False, 0.25]] # 2
  - [-1, 1, Conv, [256, 3, 2]]     # 3-P3/8
  - [-1, 2, C3k2, [512, False, 0.25]] # 4
  - [-1, 1, CBAM, []]           # 5 ⭐ P3 CBAM
  - [-1, 1, Conv, [512, 3, 2]]     # 6-P4/16
  - [-1, 2, C3k2, [512, True]]     # 7
  - [-1, 1, CBAM, []]           # 8 ⭐ P4 CBAM
  - [-1, 1, Conv, [1024, 3, 2]]    # 9-P5/32
  - [-1, 2, C3k2, [1024, True]]    # 10
  - [-1, 1, SPPF, [1024, 5]]       # 11
  - [-1, 2, C2PSA, [1024]]         # 12

# YOLO11n-P2 head (4-scale)
head:
  # FPN: P5 -> P4
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 7], 1, Concat, [1]]      # cat backbone P4
  - [-1, 2, C3k2, [512, False]]    # 15

  # FPN: P4 -> P3
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 4], 1, Concat, [1]]      # cat backbone P3
  - [-1, 2, C3k2, [256, False]]    # 18

  # FPN: P3 -> P2
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 2], 1, Concat, [1]]      # cat backbone P2
  - [-1, 2, C3k2, [128, False]]    # 21 (P2/4)

  # PAN: P2 -> P3
  - [-1, 1, Conv, [128, 3, 2]]
  - [[-1, 18], 1, Concat, [1]]     # cat head P3
  - [-1, 2, C3k2, [256, False]]    # 24 (P3/8)

  # PAN: P3 -> P4
  - [-1, 1, Conv, [256, 3, 2]]
  - [[-1, 15], 1, Concat, [1]]     # cat head P4
  - [-1, 2, C3k2, [512, False]]    # 27 (P4/16)

  # PAN: P4 -> P5
  - [-1, 1, Conv, [512, 3, 2]]
  - [[-1, 12], 1, Concat, [1]]     # cat backbone P5
  - [-1, 2, C3k2, [1024, True]]    # 30 (P5/32)

  # Detect (4-scale)
  - [[21, 24, 27, 30], 1, Detect, [nc]] # Detect(P2, P3, P4, P5)
