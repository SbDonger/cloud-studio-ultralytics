# Ultralytics YOLO11n-P2 + EMA (Neck P2 only, with residual)
# 4-scale detection: P2, P3, P4, P5
# EMA is applied after the P2 output in the Neck (FPN bottom)

nc: 10

scales:
  n: [0.50, 0.25, 1024]
  s: [0.50, 0.50, 1024]
  m: [0.50, 1.00, 512]
  l: [1.00, 1.00, 512]
  x: [1.00, 1.50, 512]

# YOLO11n backbone (same as standard P2 model)
backbone:
  # [from, repeats, module, args]
  - [-1, 1, Conv, [64, 3, 2]]             # 0-P1/2
  - [-1, 1, Conv, [128, 3, 2]]            # 1-P2/4
  - [-1, 2, C3k2, [256, False, 0.25]]     # 2
  - [-1, 1, Conv, [256, 3, 2]]            # 3-P3/8
  - [-1, 2, C3k2, [512, False, 0.25]]     # 4
  - [-1, 1, Conv, [512, 3, 2]]            # 5-P4/16
  - [-1, 2, C3k2, [512, True]]            # 6
  - [-1, 1, Conv, [1024, 3, 2]]           # 7-P5/32
  - [-1, 2, C3k2, [1024, True]]           # 8
  - [-1, 1, SPPF, [1024, 5]]              # 9
  - [-1, 2, C2PSA, [1024]]                # 10

# YOLO11n head (4-scale: P2, P3, P4, P5) + EMA on P2 output
head:
  # FPN: P5 -> P4
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 6], 1, Concat, [1]]             # cat backbone P4
  - [-1, 2, C3k2, [512, False]]           # 13

  # FPN: P4 -> P3
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 4], 1, Concat, [1]]             # cat backbone P3
  - [-1, 2, C3k2, [256, False]]           # 16

  # FPN: P3 -> P2
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 2], 1, Concat, [1]]             # cat backbone P2
  - [-1, 2, C3k2, [128, False]]           # 19 (P2/4)
  - [-1, 1, EMA, [8]]                     # 20-P2/4 EMA (with residual)

  # PAN: P2 -> P3
  - [-1, 1, Conv, [128, 3, 2]]
  - [[-1, 16], 1, Concat, [1]]            # cat head P3
  - [-1, 2, C3k2, [256, False]]           # 23 (P3/8)

  # PAN: P3 -> P4
  - [-1, 1, Conv, [256, 3, 2]]
  - [[-1, 13], 1, Concat, [1]]            # cat head P4
  - [-1, 2, C3k2, [512, False]]           # 26 (P4/16)

  # PAN: P4 -> P5
  - [-1, 1, Conv, [512, 3, 2]]
  - [[-1, 10], 1, Concat, [1]]            # cat head P5
  - [-1, 2, C3k2, [1024, True]]           # 29 (P5/32)

  # Detect (4-scale)
  - [[20, 23, 26, 29], 1, Detect, [nc]]   # Detect(P2+EMA, P3, P4, P5)
