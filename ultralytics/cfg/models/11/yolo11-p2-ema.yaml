# Ultralytics YOLO11n-P2 + EMA
# 4-scale detection: P2, P3, P4, P5

nc: 10

scales:
  n: [0.50, 0.25, 1024]

backbone:
  # [from, repeats, module, args]
  - [-1, 1, Conv, [64, 3, 2]]             # 0-P1/2
  - [-1, 1, Conv, [128, 3, 2]]            # 1-P2/4
  - [-1, 2, C3k2, [256, False, 0.25]]     # 2-P2/4

  - [-1, 1, Conv, [256, 3, 2]]            # 3-P3/8
  - [-1, 2, C3k2, [512, False, 0.25]]     # 4-P3/8
  - [-1, 1, EMA, [8]]                     # 5-P3/8 EMA

  - [-1, 1, Conv, [512, 3, 2]]            # 6-P4/16
  - [-1, 2, C3k2, [512, True]]            # 7-P4/16
  - [-1, 1, EMA, [8]]                     # 8-P4/16 EMA

  - [-1, 1, Conv, [1024, 3, 2]]           # 9-P5/32
  - [-1, 2, C3k2, [1024, True]]           # 10-P5/32
  - [-1, 1, SPPF, [1024, 5]]              # 11
  - [-1, 2, C2PSA, [1024]]                # 12-P5/32

head:
  - [-1, 1, nn.Upsample, [None, 2, nearest]]
  - [[-1, 8], 1, Concat, [1]]             # cat P4 EMA
  - [-1, 2, C3k2, [512, False]]           # 15-P4/16

  - [-1, 1, nn.Upsample, [None, 2, nearest]]
  - [[-1, 5], 1, Concat, [1]]             # cat P3 EMA
  - [-1, 2, C3k2, [256, False]]           # 18-P3/8

  - [-1, 1, nn.Upsample, [None, 2, nearest]]
  - [[-1, 2], 1, Concat, [1]]             # cat P2
  - [-1, 2, C3k2, [128, False]]           # 21-P2/4

  - [-1, 1, Conv, [128, 3, 2]]
  - [[-1, 18], 1, Concat, [1]]            # cat P3
  - [-1, 2, C3k2, [256, False]]           # 24-P3/8

  - [-1, 1, Conv, [256, 3, 2]]
  - [[-1, 15], 1, Concat, [1]]            # cat P4
  - [-1, 2, C3k2, [512, False]]           # 27-P4/16

  - [-1, 1, Conv, [512, 3, 2]]
  - [[-1, 12], 1, Concat, [1]]            # cat P5
  - [-1, 2, C3k2, [1024, True]]           # 30-P5/32

  - [[21, 24, 27, 30], 1, Detect, [nc]]
